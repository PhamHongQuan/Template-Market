services:

  frontend:
    image: node:22-alpine

    container_name: frontend

    working_dir: /app

    volumes:
      - ./frontend:/app

    ports:
      - "3000:3000"

    command: tail -f /dev/null
    

  nginx:
    image: nginx:latest
    container_name: nginx

    ports:
      - "8080:80"

    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - php

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    container_name: php

    working_dir: /var/www/html

    command: >
      php-fpm -F

    volumes:
      - ./backend:/var/www/html

    depends_on:
      - mysql

  mysql:
    image: mysql:8.4

    container_name: mysql

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: template_market

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7

    container_name: redis

    ports:
      - "6379:6379"

  mailpit:
    image: axllent/mailpit

    container_name: mailpit

    ports:
      - "1025:1025"
      - "8025:8025"

volumes:

  mysql_data: